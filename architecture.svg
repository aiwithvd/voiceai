<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="'SF Mono', 'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
    <marker id="arrowDown" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <path d="M0,0 L3,8 L6,0" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="780" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="bold">Voice AI Demo — Architecture</text>
  <text x="550" y="56" text-anchor="middle" fill="#64748b" font-size="12">Self-hosted conversational voice assistant</text>

  <!-- ==================== BROWSER LAYER ==================== -->
  <rect x="40" y="80" width="1020" height="190" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="55" y="102" fill="#64748b" font-size="11" font-weight="bold">BROWSER LAYER</text>

  <!-- Browser box -->
  <rect x="60" y="115" width="240" height="130" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="143" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="bold">Web Browser</text>
  <text x="180" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">Next.js 15 + React 19</text>
  <text x="180" y="183" text-anchor="middle" fill="#94a3b8" font-size="11">Tailwind CSS 4 + shadcn</text>
  <text x="180" y="203" text-anchor="middle" fill="#94a3b8" font-size="11">LiveKit Client SDK</text>
  <text x="180" y="228" text-anchor="middle" fill="#22d3ee" font-size="11" filter="url(#glow)">Agents UI Components</text>

  <!-- Token arrow -->
  <line x1="300" y1="160" x2="370" y2="160" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="335" y="152" text-anchor="middle" fill="#3b82f6" font-size="10">HTTP GET</text>
  <text x="335" y="175" text-anchor="middle" fill="#3b82f6" font-size="10">/token</text>

  <!-- WebRTC arrow -->
  <line x1="300" y1="210" x2="490" y2="210" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowRight)"/>
  <text x="395" y="200" text-anchor="middle" fill="#22d3ee" font-size="10">WebRTC Audio</text>

  <!-- ==================== AGENT SERVICE ==================== -->
  <rect x="380" y="80" width="330" height="190" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="395" y="102" fill="#64748b" font-size="11" font-weight="bold">AGENT SERVICE — PORT 8001</text>

  <!-- FastAPI box -->
  <rect x="395" y="115" width="300" height="75" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#shadow)"/>
  <text x="545" y="138" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">FastAPI Server</text>
  <text x="545" y="158" text-anchor="middle" fill="#94a3b8" font-size="10">Python 3.12 · uvicorn</text>
  <text x="430" y="178" fill="#34d399" font-size="10">GET /health</text>
  <text x="560" y="178" fill="#34d399" font-size="10">GET /token</text>

  <!-- Agent Worker box -->
  <rect x="395" y="200" width="300" height="55" rx="6" fill="#1e293b" stroke="#22d3ee" stroke-width="1" filter="url(#shadow)"/>
  <text x="545" y="222" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="bold">LiveKit Agent Worker</text>
  <text x="545" y="242" text-anchor="middle" fill="#94a3b8" font-size="10">Background Thread</text>

  <!-- Arrow from FastAPI to Worker -->
  <line x1="545" y1="190" x2="545" y2="198" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowDown)"/>

  <!-- ==================== LIVEKIT SERVER ==================== -->
  <rect x="730" y="80" width="310" height="190" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="745" y="102" fill="#64748b" font-size="11" font-weight="bold">MEDIA LAYER</text>

  <!-- LiveKit Server box -->
  <rect x="750" y="115" width="270" height="130" rx="8" fill="#1e293b" stroke="#22d3ee" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="885" y="143" text-anchor="middle" fill="#22d3ee" font-size="13" font-weight="bold">LiveKit Server</text>
  <text x="885" y="163" text-anchor="middle" fill="#94a3b8" font-size="11">WebRTC SFU (Docker)</text>
  <text x="885" y="183" text-anchor="middle" fill="#94a3b8" font-size="11">Go · Pion WebRTC</text>
  <text x="800" y="208" fill="#64748b" font-size="9">:7880 TCP · signaling</text>
  <text x="800" y="222" fill="#64748b" font-size="9">:7882 UDP · media</text>
  <text x="800" y="236" fill="#64748b" font-size="9">:50000-60000 UDP · WebRTC</text>

  <!-- Arrow from Agent to LiveKit -->
  <line x1="695" y1="235" x2="748" y2="235" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="720" y="228" text-anchor="middle" fill="#22d3ee" font-size="9">WebSocket</text>

  <!-- ==================== AI PIPELINE ==================== -->
  <rect x="40" y="295" width="1020" height="220" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="55" y="317" fill="#64748b" font-size="11" font-weight="bold">AI VOICE PIPELINE</text>

  <!-- VAD box -->
  <rect x="60" y="335" width="190" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="155" y="363" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="bold">① VAD</text>
  <text x="155" y="383" text-anchor="middle" fill="#c4b5fd" font-size="11">Silero VAD</text>
  <text x="155" y="400" text-anchor="middle" fill="#94a3b8" font-size="9">Voice Activity Detection</text>

  <!-- Arrow 1→2 -->
  <line x1="250" y1="375" x2="290" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- STT box -->
  <rect x="295" y="335" width="190" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="390" y="363" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="bold">② STT</text>
  <text x="390" y="383" text-anchor="middle" fill="#93c5fd" font-size="11">Whisper (faster-whisper)</text>
  <text x="390" y="400" text-anchor="middle" fill="#94a3b8" font-size="9">Audio → Text</text>

  <!-- Arrow 2→3 -->
  <line x1="485" y1="375" x2="525" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- LLM box -->
  <rect x="530" y="335" width="190" height="80" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="625" y="363" text-anchor="middle" fill="#fb923c" font-size="12" font-weight="bold">③ LLM</text>
  <text x="625" y="383" text-anchor="middle" fill="#fdba74" font-size="11">Ollama (llama3.2:3b)</text>
  <text x="625" y="400" text-anchor="middle" fill="#94a3b8" font-size="9">Text → Response</text>

  <!-- Arrow 3→4 -->
  <line x1="720" y1="375" x2="760" y2="375" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)"/>

  <!-- TTS box -->
  <rect x="765" y="335" width="190" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="860" y="363" text-anchor="middle" fill="#34d399" font-size="12" font-weight="bold">④ TTS</text>
  <text x="860" y="383" text-anchor="middle" fill="#86efac" font-size="11">Edge-TTS</text>
  <text x="860" y="400" text-anchor="middle" fill="#94a3b8" font-size="9">Response → Audio</text>

  <!-- Safe Wrappers box -->
  <rect x="60" y="430" width="895" height="40" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="507" y="455" text-anchor="middle" fill="#f472b6" font-size="11">SafeSTT · SafeLLM · SafeTTS — Error handling wrappers with fallback responses</text>

  <!-- ==================== OLLAMA SERVICE ==================== -->
  <rect x="730" y="540" width="310" height="130" rx="10" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="745" y="562" fill="#64748b" font-size="11" font-weight="bold">EXTERNAL SERVICES</text>

  <!-- Ollama box -->
  <rect x="750" y="575" width="270" height="80" rx="8" fill="#1e293b" stroke="#fb923c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="885" y="603" text-anchor="middle" fill="#fb923c" font-size="13" font-weight="bold">Ollama</text>
  <text x="885" y="623" text-anchor="middle" fill="#94a3b8" font-size="11">Local LLM Service</text>
  <text x="885" y="643" text-anchor="middle" fill="#64748b" font-size="10">Port 11434 · Metal GPU</text>

  <!-- Arrow from LLM to Ollama -->
  <line x1="720" y1="395" x2="748" y2="605" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowRight)"/>
  <text x="740" y="480" text-anchor="middle" fill="#fb923c" font-size="9" transform="rotate(-60, 740, 480)">OpenAI-compatible API</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="40" y="540" width="670" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="565" fill="#e2e8f0" font-size="13" font-weight="bold">Legend</text>

  <!-- Legend items -->
  <rect x="60" y="580" width="14" height="14" rx="3" fill="none" stroke="#a78bfa" stroke-width="2"/>
  <text x="82" y="592" fill="#c4b5fd" font-size="10">VAD — Voice Activity Detection (Silero)</text>

  <rect x="60" y="602" width="14" height="14" rx="3" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="82" y="614" fill="#93c5fd" font-size="10">STT — Speech-to-Text (faster-whisper)</text>

  <rect x="60" y="624" width="14" height="14" rx="3" fill="none" stroke="#f97316" stroke-width="2"/>
  <text x="82" y="636" fill="#fdba74" font-size="10">LLM — Large Language Model (Ollama)</text>

  <rect x="320" y="580" width="14" height="14" rx="3" fill="none" stroke="#10b981" stroke-width="2"/>
  <text x="342" y="592" fill="#86efac" font-size="10">TTS — Text-to-Speech (Edge-TTS)</text>

  <rect x="320" y="602" width="14" height="14" rx="3" fill="none" stroke="#22d3ee" stroke-width="2"/>
  <text x="342" y="614" fill="#67e8f9" font-size="10">WebRTC — Real-time audio transport</text>

  <rect x="320" y="624" width="14" height="14" rx="3" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="342" y="636" fill="#fbcfe8" font-size="10">Error wrappers — Resilience layer</text>

  <!-- Footer -->
  <text x="550" y="765" text-anchor="middle" fill="#475569" font-size="10">All components run locally on Apple Silicon · No cloud dependencies · All models configurable via .env</text>
</svg>
